server:
  port: 9991

spring:
  datasource:
    url: jdbc:mysql://localhost:4444/liveshop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: liveshop
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info
    com.ch.jwtserver: debug
    org.hibernate.sql: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace
    com.ch.memberservice.member.security: debug
    com.ch.memberservice.member.controller: debug

app:
  frontend-url: "http://localhost:5173"

  jwt:
    secret: "qwer"
    access-exp-seconds: 900 # jwt access token 시간을 15분으로 설정
    refresh-exp-seconds: 1209600 # refresh token 은 14일