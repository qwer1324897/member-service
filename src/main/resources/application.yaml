server:
  port: 9993

spring:
  datasource:
    url: jdbc:mysql://localhost:4444/liveshop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: liveshop
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  # OAuth2 로그인 관련
  # 구글은 별도의 인증 요청, 토큰 요청, 사용자 조회 URL 을 등록할 필요가 없다. spring 라이브러리 내장 기능에 들어있음
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 800852147743-5e7gr6mkfp3phvsrb28eecu0qnb28src.apps.googleusercontent.com
            client-secret: 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
            scope:
              - openid
              - profile
              - email
          naver:
            client-id: GCq5Kwh_jE675edUUqbk
            client-secret: iea2IYHD64
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:9993/login/oauth2/code/naver"
            scope: [name, email, gender, birthyear, mobile]

          kakao:
            client-id: 5ecced8089e54d49af8671fdd95f0d10
            client-secret: HkY8T0OSdECsg9M43ywoTlhgVQLwXIF2
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:9993/login/oauth2/code/kakao"
            scope: [profile_nickname]

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # 로그인 인증 요청 주소
            token-uri: https://nid.naver.com/oauth2.0/token # 토큰 요청 주소
            user-info-uri: https://openapi.naver.com/v1/nid/me  # 사용자 정보 요청 주소
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize # 로그인 인증 요청 주소
            token-uri: https://kauth.kakao.com/oauth/token # 토큰 요청 주소
            user-info-uri: https://kapi.kakao.com/v2/user/me  # 사용자 정보 요청 주소
            user-name-attribute: id

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 5555
logging:

  level:
    root: info
    com.ch.jwtserver: debug
    org.hibernate.sql: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace
    com.ch.memberservice.member.security: debug
    com.ch.memberservice.member.controller: debug
    com.ch.memberservice.member.jwt: debug
app:

  frontend-url: "http://localhost:5173"


  jwt:
    secret: "eebM8sODDcZAdWLhrSLoHk7M5rkpQtzZDpT21t5ra+4="
    access-exp-seconds: 900 # jwt access token 시간을 15분으로 설정
    refresh-exp-seconds: 1209600 # refresh token 은 14일
    refresh-cookie-path: "/api/auth"
    refresh-cookie-secure: false
    refresh-cookie-sameSite: "Lax"

